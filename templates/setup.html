<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>初始設定 - 台灣監理站車牌競標即時看板</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container" style="max-width:420px;margin:0 auto;">
  <div style="padding-top:calc(48px + env(safe-area-inset-top));text-align:center;">
    <h1 style="font-size:22px;">建立管理帳號</h1>
    <div class="meta">第一次使用，請先設定登入帳號密碼，之後每次進入網頁都需要登入。</div>
  </div>

  <form method="post" class="panel" style="margin-top:20px;">
    <div class="ios-row column">
      <label for="username">帳號</label>
      <input type="text" id="username" name="username" autocomplete="username" placeholder="自訂帳號名稱" required>
    </div>
    <div class="ios-row column">
      <label for="password">密碼（至少 6 碼）</label>
      <div class="pw-field">
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="設定登入密碼" required minlength="6">
        <button type="button" class="pw-toggle">顯示</button>
      </div>
    </div>

    {% if error %}
    <div class="status-msg err">{{ error }}</div>
    {% endif %}

    <button type="submit" class="ios-btn-block primary">建立帳號並登入</button>
  </form>

  <div class="hint" style="text-align:center;">帳號密碼會存在本機 config.json，僅供這台伺服器登入使用。</div>
</div>

<script src="/static/password-toggle.js"></script>
</body>
</html>
